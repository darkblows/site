    <style>
      :root {
        --bg-dark: #07070a;
        --accent-gold: #d4af37;
        --accent-gold-glow: rgba(212, 175, 55, 0.4);
        --cyan-mystic: #00e5ff;
        --cyan-mystic-glow: rgba(0, 229, 255, 0.4);
        --purple-mystic: #9c27b0;
        --purple-mystic-glow: rgba(156, 39, 176, 0.4);
        --ruby-fire: #ff1744;
        --ruby-fire-glow: rgba(255, 23, 68, 0.4);
        --text-light: #e0e0e0;
        --text-dim: #9e9ea0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-light);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        overflow-x: hidden;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 20% 30%, rgba(20, 10, 45, 0.6) 0%, transparent 40%),
          radial-gradient(circle at 80% 70%, rgba(10, 35, 45, 0.5) 0%, transparent 40%);
        z-index: -2;
        pointer-events: none;
      }

      .bg-geometry {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 600px;
        opacity: 0.03;
        z-index: -1;
        pointer-events: none;
        animation: slowRotate 120s linear infinite;
      }

      @keyframes slowRotate {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      header {
        text-align: center;
        padding: 60px 20px 40px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        background: linear-gradient(to bottom, rgba(7, 7, 10, 0.95), rgba(7, 7, 10, 0.8));
      }

      .header-symbol {
        font-size: 2rem;
        color: var(--accent-gold);
        text-shadow: 0 0 10px var(--accent-gold-glow);
        margin-bottom: 10px;
      }

      h1 {
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 2.8rem;
        font-weight: 800;
        letter-spacing: 4px;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        text-transform: uppercase;
        margin-bottom: 15px;
      }

      .intro-text {
        max-width: 600px;
        margin: 0 auto;
        font-size: 1rem;
        color: var(--text-dim);
        font-weight: 300;
        letter-spacing: 1px;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .portal-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 40px;
        align-items: start;
      }

      .stage-column {
        background: rgba(13, 13, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 30px 20px;
        backdrop-filter: blur(10px);
        transition: transform 0.4s ease, border-color 0.4s ease;
      }

      .stage-column.beginning {
        border-top: 4px solid var(--cyan-mystic);
      }
      .stage-column.beginning:hover {
        border-color: var(--cyan-mystic);
        box-shadow: 0 10px 30px rgba(0, 229, 255, 0.05);
        transform: translateY(-5px);
      }

      .stage-column.intermediate {
        border-top: 4px solid var(--purple-mystic);
      }
      .stage-column.intermediate:hover {
        border-color: var(--purple-mystic);
        box-shadow: 0 10px 30px rgba(156, 39, 176, 0.05);
        transform: translateY(-5px);
      }

      .stage-column.advanced {
        border-top: 4px solid var(--ruby-fire);
      }
      .stage-column.advanced:hover {
        border-color: var(--ruby-fire);
        box-shadow: 0 10px 30px rgba(255, 23, 68, 0.05);
        transform: translateY(-5px);
      }

      .stage-column.special {
        border-top: 4px solid var(--accent-gold);
      }
      .stage-column.special:hover {
        border-color: var(--accent-gold);
        box-shadow: 0 10px 30px rgba(212, 175, 55, 0.05);
        transform: translateY(-5px);
      }

      .stage-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .stage-title-esoteric {
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 0.9rem;
        letter-spacing: 3px;
        color: var(--accent-gold);
        text-transform: uppercase;
        margin-bottom: 5px;
      }

      .stage-title {
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 1.8rem;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 2px;
      }

      .stage-desc {
        font-size: 0.85rem;
        color: var(--text-dim);
        margin-top: 8px;
        font-style: italic;
      }

      .meditations-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .meditation-item {
        position: relative;
      }

      .meditation-link {
        display: block;
        padding: 16px 20px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 8px;
        text-decoration: none;
        color: var(--text-light);
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .meditation-link::before {
        content: '🜁';
        display: inline-block;
        margin-right: 10px;
        color: var(--accent-gold);
        font-size: 0.9rem;
        transition: transform 0.3s ease;
      }

      .beginning .meditation-link:hover {
        background: rgba(0, 229, 255, 0.04);
        border-color: rgba(0, 229, 255, 0.3);
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
        transform: translateX(5px);
      }
      .beginning .meditation-link:hover::before {
        color: var(--cyan-mystic);
        transform: rotate(180deg);
      }

      .intermediate .meditation-link:hover {
        background: rgba(156, 39, 176, 0.04);
        border-color: rgba(156, 39, 176, 0.3);
        box-shadow: 0 0 10px rgba(156, 39, 176, 0.1);
        transform: translateX(5px);
      }
      .intermediate .meditation-link:hover::before {
        color: var(--purple-mystic);
        transform: rotate(180deg);
      }

      .advanced .meditation-link:hover {
        background: rgba(255, 23, 68, 0.04);
        border-color: rgba(255, 23, 68, 0.3);
        box-shadow: 0 0 10px rgba(255, 23, 68, 0.1);
        transform: translateX(5px);
      }
      .advanced .meditation-link:hover::before {
        color: var(--ruby-fire);
        transform: rotate(180deg);
      }

      .special .meditation-link:hover {
        background: rgba(212, 175, 55, 0.04);
        border-color: rgba(212, 175, 55, 0.3);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        transform: translateX(5px);
      }
      .special .meditation-link:hover::before {
        color: var(--accent-gold);
        transform: rotate(180deg);
      }

      .meditation-title {
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 4px;
        color: #ffffff;
      }

      .meditation-desc {
        font-size: 0.8rem;
        color: var(--text-dim);
        display: block;
        font-weight: 300;
      }

      footer {
        text-align: center;
        padding: 50px 20px;
        margin-top: 60px;
        border-top: 1px solid rgba(212, 175, 55, 0.1);
        font-size: 0.8rem;
        color: var(--text-dim);
        letter-spacing: 2px;
      }

      .footer-credits {
        text-transform: none;
        font-weight: 400;
        margin-top: 10px;
        font-size: 0.85rem;
        color: var(--accent-gold);
        text-shadow: 0 0 5px rgba(212, 175, 55, 0.2);
        letter-spacing: 1px;
      }

      .footer-symbol {
        font-size: 1.2rem;
        color: var(--accent-gold);
        margin-bottom: 10px;
      }

      @media (max-width: 900px) {
        .portal-grid {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 2.2rem;
        }
      }

      /* ============ VIEWER-SPECIFIC STYLES (new, additive) ============ */

      [data-view] {
        display: none;
      }
      [data-view].active {
        display: block;
      }

      .viewer-toolbar {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px 20px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        text-decoration: none;
        font-size: 0.9rem;
        letter-spacing: 1px;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
      }
      .back-link:hover {
        color: var(--accent-gold);
        border-color: var(--accent-gold-glow);
        background: rgba(212, 175, 55, 0.05);
      }

      .export-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--bg-dark);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 1px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: var(--accent-gold);
        transition: all 0.3s ease;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
      }
      .export-btn:hover {
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        transform: translateY(-2px);
      }
      .export-btn.copied {
        background: #6be675;
      }

      .viewer-header {
        text-align: center;
        padding: 20px 20px 10px;
        max-width: 900px;
        margin: 0 auto;
      }

      .viewer-eyebrow {
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 0.85rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .viewer-eyebrow.beginning { color: var(--cyan-mystic); }
      .viewer-eyebrow.intermediate { color: var(--purple-mystic); }
      .viewer-eyebrow.advanced { color: var(--ruby-fire); }
      .viewer-eyebrow.special { color: var(--accent-gold); }

      .viewer-title {
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
        font-size: 2.2rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .viewer-desc {
        color: var(--text-dim);
        font-size: 1rem;
        font-weight: 300;
        max-width: 640px;
        margin: 0 auto;
      }

      .viewer-stage {
        max-width: 1400px;
        margin: 30px auto 0;
        padding: 0 20px 60px;
        display: flex;
        justify-content: center;
      }

      .svg-frame {
        max-width: 100%;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        background: #0d0d0d;
        padding: 24px;
        display: flex;
        justify-content: center;
      }

      .svg-frame svg {
        max-width: 100%;
        height: auto;
      }

      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(20, 20, 25, 0.95);
        border: 1px solid var(--accent-gold-glow);
        color: var(--text-light);
        padding: 14px 24px;
        border-radius: 8px;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.35s ease;
        z-index: 100;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* templates holding raw SVG source must never render in the portal */
      template {
        display: none;
      }
    </style>
  </head>

    <div data-view="viewer">

      <div class="viewer-stage">
        <div class="svg-frame" id="svg-frame">

        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

<template id="tpl-beginning_candle_flame_concentration"><svg width="680" height="780" viewBox="0 0 680 780" role="img" xmlns="http://www.w3.org/2000/svg">
<title>First-person POV animation of candle flame concentration and afterimage manipulation</title>
<desc>A 24-second loop showing a candle flame. The view goes pitch black as hands cover the eyes. A glowing afterimage of the flame drifts in the darkness, gets pulled back to the center, shrinks, and changes color from white to pink, to red, to dark, training psychic focus.</desc>

<defs>
  <!-- Glow for the physical candle -->
  <radialGradient id="candleGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.6"/>
    <stop offset="40%" stop-color="#FFB300" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
  </radialGradient>

  <!-- Heavy Blur for the Afterimage (Imprint) -->
  <filter id="afterimageBlur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur" />
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Subtle glow for text -->
  <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2" result="blur" />
    <feComponentTransfer in="blur" result="glow">
      <feFuncA type="linear" slope="2"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- ================= BACKGROUND ================= -->
<rect width="680" height="780" fill="#080808"/>

<!-- ================= SCENE 1: THE PHYSICAL CANDLE ================= -->
<g id="real-candle" transform="translate(340, 420)">
  <!-- Fade out when eyes close -->
  <animate attributeName="opacity" values="1; 1; 0; 0; 0; 1" keyTimes="0; 0.24; 0.26; 0.95; 0.97; 1" dur="24s" repeatCount="indefinite"/>
  
  <!-- Candle Stick -->
  <rect x="-15" y="45" width="30" height="200" fill="#E6E6E6" rx="3"/>
  <!-- Wick -->
  <line x1="0" y1="45" x2="0" y2="30" stroke="#444" stroke-width="3"/>
  
  <!-- Flame Group with continuous flickering -->
  <g>
    <animateTransform attributeName="transform" type="scale" values="1,1; 1.05,1.1; 0.95,0.9; 1,1.05; 1,1" dur="0.2s" repeatCount="indefinite"/>
    
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="70" fill="url(#candleGlow)">
      <animate attributeName="opacity" values="0.8; 1; 0.7; 0.9; 0.8" dur="0.3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Outer Orange Flame -->
    <path d="M 0 -70 C 0 -70 -20 0 -20 20 C -20 35 -10 45 0 45 C 10 45 20 35 20 20 C 20 0 0 -70 0 -70 Z" fill="#FFC107"/>
    <!-- Inner Yellow/White Flame -->
    <path d="M 0 -40 C 0 -40 -10 -10 -10 10 C -10 20 -5 25 0 25 C 5 25 10 20 10 10 C 10 -10 0 -40 0 -40 Z" fill="#FFF8E1"/>
  </g>
</g>

<!-- ================= TRANSITION: CLOSING EYES & HANDS ================= -->
<!-- Pitch black shutters sliding in to simulate hands covering the eyes -->
<rect x="-340" y="0" width="340" height="780" fill="#020202">
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 340,0; 340,0; 0,0" keyTimes="0; 0.24; 0.26; 0.95; 0.97" dur="24s" repeatCount="indefinite"/>
</rect>
<rect x="680" y="0" width="340" height="780" fill="#020202">
  <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; -340,0; -340,0; 0,0" keyTimes="0; 0.24; 0.26; 0.95; 0.97" dur="24s" repeatCount="indefinite"/>
</rect>

<!-- Viewpoint Center Target (helps show where the center of vision is in the dark) -->
<circle cx="340" cy="420" r="30" fill="none" stroke="#222" stroke-dasharray="4 4" opacity="0">
  <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.26; 0.28; 0.95; 0.97" dur="24s" repeatCount="indefinite"/>
</circle>

<!-- ================= SCENE 2: THE AFTERIMAGE (IMPRINT) ================= -->
<g id="afterimage" transform="translate(340, 420)" opacity="0">
  
  <!-- Appearance: Fades in after eyes close, fades out before eyes open -->
  <animate attributeName="opacity" values="0; 0; 0; 0.8; 0.8; 0; 0" keyTimes="0; 0.26; 0.28; 0.30; 0.92; 0.95; 1" dur="24s" repeatCount="indefinite"/>

  <!-- Drift Motion (Translate): Imprint wanders around, then gets pulled back to center -->
  <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; 60,-40; -70,30; 40,60; -50,-20; 0,0; 0,0; 0,0"
      keyTimes="0; 0.30; 0.36; 0.42; 0.48; 0.54; 0.60; 0.95; 1"
      dur="24s" repeatCount="indefinite" additive="sum"/>

  <!-- Condense/Shrink (Scale): Starts normal, shrinks during Phase 4 -->
  <animateTransform attributeName="transform" type="scale"
      values="1,1; 1,1; 1,1; 0.7,0.7; 0.4,0.4; 0.15,0.15; 0,0; 0,0"
      keyTimes="0; 0.30; 0.60; 0.70; 0.80; 0.90; 0.92; 1"
      dur="24s" repeatCount="indefinite" additive="sum"/>

  <!-- The Imprint Path (same flame shape, but glowing and blurry) -->
  <path d="M 0 -70 C 0 -70 -20 0 -20 20 C -20 35 -10 45 0 45 C 10 45 20 35 20 20 C 20 0 0 -70 0 -70 Z" filter="url(#afterimageBlur)">
    <!-- Color Change: Bright White -> Pink -> Red -> Dark Red -> Black -->
    <animate attributeName="fill"
        values="#FFFFFF; #FFFFFF; #FFFFFF; #FF80AB; #D50000; #3E0000; #000000"
        keyTimes="0; 0.30; 0.60; 0.70; 0.80; 0.90; 1"
        dur="24s" repeatCount="indefinite"/>
  </path>
</g>

<!-- ================= TEXTS & INSTRUCTIONS ================= -->
<text x="340" y="80" font-family="sans-serif" font-size="22" font-weight="bold" fill="#F0F0F0" text-anchor="middle" filter="url(#textGlow)">
  Candle Flame Concentration
</text>

<!-- Phase 1 Text -->
<text x="340" y="115" font-family="sans-serif" font-size="14" fill="#FFC107" font-weight="bold" text-anchor="middle" opacity="0">
  <tspan>Phase 1: Stare directly at the physical flame. Do not lose focus.</tspan>
  <animate attributeName="opacity" values="1; 1; 0; 0; 0; 1" keyTimes="0; 0.23; 0.25; 0.96; 0.98; 1" dur="24s" repeatCount="indefinite"/>
</text>

  <tspan>Phase 2: Eyes closed, hands cupped. The imprint drifts in your vision.</tspan>
  <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.25; 0.28; 0.58; 0.60; 1" dur="24s" repeatCount="indefinite"/>
</text>

<!-- Phase 3 Text -->
<text x="340" y="115" font-family="sans-serif" font-size="14" fill="#FF80AB" font-weight="bold" text-anchor="middle" opacity="0">
  <tspan>Phase 3 (Intermediate): Pull it to the center. Condense it. Change its color.</tspan>
  <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.59; 0.61; 0.94; 0.96" dur="24s" repeatCount="indefinite"/>
</text>

<text x="340" y="140" font-family="sans-serif" font-size="14" fill="#D50000" font-weight="bold" text-anchor="middle" opacity="0">
  <tspan>(White ➔ Pink ➔ Red ➔ Dark)</tspan>
  <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.59; 0.61; 0.94; 0.96" dur="24s" repeatCount="indefinite"/>
</text>


<!-- ================= PHYSICAL POSTURE ICON (Bottom Right) ================= -->
<!-- This serves to remind the user what they should physically be doing -->
<g transform="translate(560, 620)">
  <!-- Text label -->
  <text x="0" y="-15" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">Physical Posture</text>
  
  <!-- Line art of the girl cupping her eyes -->
  <g stroke-width="2" fill="none">
    <!-- Animate stroke color: dark when eyes open, bright when eyes close to highlight it -->
    <animate attributeName="stroke" values="#333; #333; #AEEA00; #AEEA00; #333" keyTimes="0; 0.24; 0.26; 0.95; 0.97" dur="24s" repeatCount="indefinite"/>
    
    <!-- Head/Hair Outline -->
    <path d="M -25 -20 Q -30 30 -40 50 M 25 -20 Q 30 30 40 50" />
    <!-- Shoulders -->
    <path d="M -35 50 Q -50 60 -60 120 M 35 50 Q 50 60 60 120" />
    
    <!-- Hands Covering Face (Filled to block the face lines underneath) -->
    <!-- Left Hand -->
    <path d="M -50 120 C -50 60 -20 30 -10 -5 C -5 -20 5 -20 0 -5 C -5 30 -20 60 -20 120 Z" fill="#080808">
      <animate attributeName="stroke" values="#333; #333; #AEEA00; #AEEA00; #333" keyTimes="0; 0.24; 0.26; 0.95; 0.97" dur="24s" repeatCount="indefinite"/>
    </path>
    
    <!-- Right Hand -->
    <path d="M 50 120 C 50 60 20 30 10 -5 C 5 -20 -5 -20 0 -5 C 5 30 20 60 20 120 Z" fill="#080808">
      <animate attributeName="stroke" values="#333; #333; #AEEA00; #AEEA00; #333" keyTimes="0; 0.24; 0.26; 0.95; 0.97" dur="24s" repeatCount="indefinite"/>
    </path>
  </g>
</g>

<!-- Side notes about the purpose -->
<text x="30" y="680" font-family="sans-serif" font-size="12" fill="#555">
  <tspan x="30" dy="0">Purpose:</tspan>
  <tspan x="30" dy="18">Develops one-pointed,</tspan>
  <tspan x="30" dy="18">laser-like concentration</tspan>
  <tspan x="30" dy="18">and trains the 3rd Eye.</tspan>
</text>

</svg></template>

<template id="tpl-beginning_aura_cleansing"><svg width="680" height="780" viewBox="0 0 680 780" role="img" xmlns="http://www.w3.org/2000/svg">

      <feMergeNode in="SourceGraphic"/>

      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>

    <feGaussianBlur stdDeviation="12" result="blur" />
    <feComponentTransfer in="blur" result="glow">
      <feFuncA type="linear" slope="1.5"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

    <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2"/>

<template id="tpl-advanced_soul_division"><svg width="720" height="940" viewBox="0 0 720 940" role="img" xmlns="http://www.w3.org/2000/svg">

<desc>A 24-second visual loop mapping three levels of attention. Phase 1: Expanding/contracting cyan outer Aura. Phase 2: Illuminating white-gold internal Body of Light. Phase 3: Radiant golden halo representing the Mental Body. Phase 4: Symmetrical integration of all three fields.</desc>

<defs>
  <!-- Glow Filters -->
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  
  <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="15" result="blur" />
    <feComponentTransfer in="blur" result="glow">
      <feFuncA type="linear" slope="1.8"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Aura Gradients -->
  <radialGradient id="mentalHaloGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="40%" stop-color="#FFF59D" stop-opacity="0.8"/>
    <stop offset="80%" stop-color="#7F77DD" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
  </radialGradient>

  <!-- Reusable Base Figure (Dark Silhouette with exact face details) -->
  <g id="meditating-figure">
    <ellipse cx="300" cy="720" rx="115" ry="13" fill="#888780" opacity="0.15"/>
    <path d="M215 700 Q205 660 220 630 Q235 615 260 615 L260 640 Q245 655 245 680 Q245 700 260 705 Z" fill="#5F5E5A" opacity="0.4" stroke="#444441" stroke-width="1"/>
    <path d="M385 700 Q395 660 380 630 Q365 615 340 615 L340 640 Q355 655 355 680 Q355 700 340 705 Z" fill="#5F5E5A" opacity="0.4" stroke="#444441" stroke-width="1"/>
    <path d="M225 615 Q210 560 225 520 Q235 495 260 480 L260 500 Q245 515 240 540 Q235 570 245 605 Q250 615 260 618 Z" fill="#5F5E5A" opacity="0.38" stroke="#444441" stroke-width="1"/>
    <path d="M375 615 Q390 560 375 520 Q365 495 340 480 L340 500 Q355 515 360 540 Q365 570 355 605 Q350 615 340 618 Z" fill="#5F5E5A" opacity="0.38" stroke="#444441" stroke-width="1"/>
    <path d="M245 630 Q225 590 235 550 L250 500 Q235 480 238 460 Q255 452 300 450 Q345 452 362 460 Q365 480 350 500 L365 550 Q375 590 355 630 Q300 650 245 630 Z" fill="#6B6A65" opacity="0.4" stroke="#444441" stroke-width="1"/>
    <path d="M258 460 Q248 400 262 355 Q275 330 300 322 Q325 330 338 355 Q352 400 342 460 Q321 470 300 471 Q279 470 258 460 Z" fill="#888780" opacity="0.32" stroke="#5F5E5A" stroke-width="1"/>
    <circle cx="300" cy="278" r="42" fill="#B4B2A9" opacity="0.4" stroke="#5F5E5A" stroke-width="1"/>
    <path d="M262 265 Q262 224 300 218 Q338 224 338 265 Q338 238 300 232 Q262 238 262 265 Z" fill="#2C2C2A" opacity="0.55"/>
    <ellipse cx="286" cy="280" rx="3" ry="4" fill="#2C2C2A" opacity="0.4"/>
    <ellipse cx="314" cy="280" rx="3" ry="4" fill="#2C2C2A" opacity="0.4"/>
    <path d="M292 300 Q300 305 308 300" stroke="#5F5E5A" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M270 246 Q286 240 298 244" stroke="#2C2C2A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M330 246 Q314 240 302 244" stroke="#2C2C2A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>
</defs>

<!-- BACKGROUND -->
<rect width="720" height="940" fill="#0d0d0d"/>


<!-- ================================================================= -->
<!-- =================== LAYER 2: THE ENERGETIC AURA ================= -->
<!-- ================================================================= -->
<!-- Traces the outer peripersonal space envelope, expanding/contracting during Phase 1 & 4 -->
<g filter="url(#glow)">
  <path d="M 180 710 Q 170 660 190 610 Q 210 590 230 590 Q 190 520 210 470 Q 240 400 240 330 Q 200 240 300 210 Q 400 240 360 330 Q 360 400 390 470 Q 410 520 370 590 Q 390 590 410 610 Q 430 660 420 710 Z" 
        fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.1">
    <!-- Active and breathing during Phase 1 (0s-6s) and Phase 4 (18s-24s) -->
    <animate attributeName="opacity" values="0.1; 0.95; 0.1; 0.1; 0.95" keyTimes="0; 0.23; 0.25; 0.75; 1" dur="24s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.5; 4.5; 1.5" dur="3s" repeatCount="indefinite" />
  </path>
</g>


<!-- ================= THE MEDITATING FIGURE ================= -->
<use href="#meditating-figure" />


<!-- ================================================================= -->
<!-- ================= LAYER 1: THE INTERNAL BODY OF LIGHT ============ -->
<!-- ================================================================= -->
<!-- Highlights the internal somatosensory nervous network during Phase 2 & 4 -->
<g filter="url(#heavyGlow)" opacity="0">
  <animate attributeName="opacity" values="0; 0; 0.85; 0.1; 0.85" keyTimes="0; 0.23; 0.25; 0.75; 1" dur="24s" repeatCount="indefinite" />
  
  <!-- Glowing central spine line -->
  <line x1="300" y1="215" x2="300" y2="650" stroke="#FFF59D" stroke-width="4.5" stroke-linecap="round" />
  <!-- Radiant internal body contours -->
  <path d="M 230 610 L 260 480 M 370 610 L 340 480" stroke="#FFF59D" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 245 630 L 250 500 L 300 450 L 350 500 L 355 630" fill="none" stroke="#FFF59D" stroke-width="2.5" stroke-linecap="round" />
</g>


<!-- ================================================================= -->
<!-- ================ LAYER 3: THE GOLDEN MENTAL BODY ================ -->
<!-- ================================================================= -->
<!-- Glowing crown/head mandala representing raw executive awareness during Phase 3 & 4 -->
<g transform="translate(300, 255)" opacity="0">
  <animate attributeName="opacity" values="0; 0; 0; 0.85; 0.85" keyTimes="0; 0.25; 0.48; 0.50; 1" dur="24s" repeatCount="indefinite" />
  
  <!-- Outer mental halo expansion -->
  <circle cx="0" cy="0" r="85" fill="url(#mentalHaloGrad)" filter="url(#heavyGlow)">
    <animate attributeName="r" values="60; 95; 60" dur="3.5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Dotted rays of attention shooting outward -->
  <g stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="4 6" filter="url(#glow)">
    <line x1="0" y1="0" x2="-80" y2="-80" />
    <line x1="0" y1="0" x2="80" y2="-80" />
    <line x1="0" y1="0" x2="-110" y2="0" />
    <line x1="0" y1="0" x2="110" y2="0" />
    <line x1="0" y1="0" x2="0" y2="-110" />
  </g>
</g>


<!-- ================================================================= -->
<!-- ============= THE CHAKRAS (Respecting Original Design) ============= -->
<!-- ================================================================= -->
<!-- Baseline spinning chakras -->
<!-- 1st Root — Red (Y=605) -->
<g transform="translate(300,605)" opacity="0.4">
  <polygon points="0,-22 19,11 -19,11" fill="#E24B4A" stroke="#791F1F" stroke-width="1">
    <animateTransform attributeName="transform" type="scale" values="1,1;0.1,1;-1,1;0.1,1;1,1" dur="0.55s" repeatCount="indefinite"/>
  </polygon>
</g>

<!-- 4th Heart — Green (Y=375) -->
<g transform="translate(300,375)" opacity="0.4">
  <polygon points="0,-20 18,0 0,20 -18,0" fill="#5DCAA5" stroke="#085041" stroke-width="1">
    <animateTransform attributeName="transform" type="scale" values="1,1;0.1,1;-1,1;0.1,1;1,1" dur="0.55s" repeatCount="indefinite"/>
  </polygon>
</g>


<!-- ================================================================= -->
<!-- ================ LABELS & DOTTED POINTERS (Right) ================ -->
<!-- ================================================================= -->
<g stroke="#444" stroke-width="1" stroke-dasharray="3 3">
  <!-- Mental Body Line -->
  <line x1="380" y1="200" x2="505" y2="205" />
  <!-- Energetic Aura Line -->
  <line x1="390" y1="350" x2="505" y2="355" />
  <!-- Body of light Line -->
  <line x1="305" y1="500" x2="505" y2="505" />
</g>

<!-- Labeled Texts -->
<g font-family="sans-serif" font-size="11" fill="#cccccc" font-weight="bold">
  <!-- Mental Body Label -->
  <text x="510" y="209" fill="#FFD54F">Mental Body (Meta-Cognition)</text>
  <text x="510" y="224" font-weight="normal" fill="#888">Awareness monitoring; prefrontal attention control</text>

  <!-- Energetic Aura Label -->
  <text x="510" y="359" fill="#00E5FF" filter="url(#glow)">Astral Aura (Proprioception)</text>
  <text x="510" y="374" font-weight="normal" fill="#888">Peripersonal space boundary; personal buffer</text>

  <!-- Body of light Label -->
  <text x="510" y="509" fill="#FFF59D">Body of Light (Interoception)</text>
  <text x="510" y="524" font-weight="normal" fill="#888">Internal somatosensory cues and spinal currents</text>
</g>


<!-- ================================================================= -->
<!-- ==================== MEDITATION GUIDE PANEL ===================== -->
<!-- ================================================================= -->
<g transform="translate(0, 0)">
  <!-- Panel Glass Frame -->
  <rect x="30" y="770" width="660" height="145" rx="14" fill="#111116" stroke="#2c2c35" stroke-width="1.5" />
  
  <!-- PHASE 1 TEXTS (0s - 6s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="1; 1; 0; 0; 0" keyTimes="0; 0.23; 0.25; 0.98; 1" dur="24s" repeatCount="indefinite" />
    <text x="360" y="805" font-family="sans-serif" font-size="15" font-weight="bold" fill="#00E5FF" text-anchor="middle" filter="url(#glow)">
      PHASE 1: MEDITATE AND CALIBRATE THE ASTRAL AURA
    </text>
    <text x="360" y="835" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">
      Expand your awareness a few centimeters beyond your body. Trace the peripersonal edge.
    </text>
    <text x="360" y="865" font-family="sans-serif" font-size="13" font-style="italic" fill="#FFFFFF" font-weight="bold" text-anchor="middle">
      "Breathe energy into your aura. Contract and expand it smoothly in place."
    </text>
  </g>

  <!-- PHASE 2 TEXTS (6s - 12s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.23; 0.25; 0.48; 0.50; 1" dur="24s" repeatCount="indefinite" />
    <text x="360" y="805" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFF59D" text-anchor="middle" filter="url(#glow)">
      PHASE 2: ACTIVATE AND SENSE THE BODY OF LIGHT
    </text>
    <text x="360" y="835" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">
      Shift focus completely inward. Tune into the visceral hum and internal somatic currents.
    </text>
    <text x="360" y="865" font-family="sans-serif" font-size="13" font-style="italic" fill="#FFF59D" font-weight="bold" text-anchor="middle">
      "Breathe through your spine. Feel the inner physical column glowing with warm light."
    </text>
  </g>

  <!-- PHASE 3 TEXTS (12s - 18s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.48; 0.50; 0.73; 0.75; 1" dur="24s" repeatCount="indefinite" />
    <text x="360" y="805" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7F77DD" text-anchor="middle" filter="url(#glow)">
      PHASE 3: FOCUS EXCLUSIVELY ON THE MENTAL BODY
    </text>
    <text x="360" y="835" font-family="sans-serif" font-size="12" fill="#E0E0E0" text-anchor="middle">
      Direct attention to awareness itself. Monitor the source and direction of your thoughts.
    </text>
    <text x="360" y="865" font-family="sans-serif" font-size="13" font-style="italic" fill="#FFFFFF" font-weight="bold" text-anchor="middle">
      "Wherever you place your focus, that is your mental body. Expand your observing mind."
    </text>
  </g>

  <!-- PHASE 4 TEXTS (18s - 24s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.73; 0.75; 0.98; 1" dur="24s" repeatCount="indefinite" />
    <text x="360" y="805" font-family="sans-serif" font-size="15" font-weight="bold" fill="#AEEA00" text-anchor="middle" filter="url(#glow)">
      PHASE 4: INTEGRATE ALL THREE VEHICLES OF CONSCIOUSNESS
    </text>
    <text x="360" y="835" font-family="sans-serif" font-size="11.5" fill="#E0E0E0" text-anchor="middle">
      Harmonize the outer boundary (Aura), internal somatics (Light), and raw awareness (Mind).
    </text>
    <text x="360" y="865" font-family="sans-serif" font-size="13" font-style="italic" fill="#AEEA00" font-weight="bold" text-anchor="middle">
      "Aligning these fields unifies your cognitive, perceptual, and physiological systems."
    </text>
  </g>
</g>

<!-- Side notes -->
<text x="40" y="700" font-family="sans-serif" font-size="11" fill="#666" width="150" opacity="0.8">
  <tspan x="40" dy="0" fill="#00E5FF" font-weight="bold">Outer Boundary:</tspan>
  <tspan x="40" dy="18">Meditating on the aura</tspan>
  <tspan x="40" dy="18">stabilizes the premotor</tspan>
  <tspan x="40" dy="18">parietal peripersonal maps.</tspan>
</text>

<text x="480" y="700" font-family="sans-serif" font-size="11" fill="#666" width="150" opacity="0.8">
  <tspan x="480" dy="0" fill="#FFF59D" font-weight="bold">Quiet Environment:</tspan>
  <tspan x="480" dy="18">Removing external noise</tspan>
  <tspan x="480" dy="18">prevents startle reflexes</tspan>
  <tspan x="480" dy="18">during deep somatic scans.</tspan>
</text>

</svg></template>
<template id="tpl-advanced_elemental_evocation"><svg width="720" height="940" viewBox="0 0 720 940" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Elemental Evocation — External Sphere Condensation and Dissolution</title>
<desc>A 24-second loop demonstrating the evocation of the four elements into an external sphere in front of the body. Phase 1: Fire (0-6s). Phase 2: Air (6-12s). Phase 3: Water (12-18s). Phase 4: Earth (18-24s).</desc>

<defs>
  <!-- Glow Filters -->
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  
  <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="blur" />
    <feComponentTransfer in="blur" result="glow">
      <feFuncA type="linear" slope="1.5"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="glow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Gradients for Element Spheres -->
  <radialGradient id="fireSphere" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="35%" stop-color="#FF5252" stop-opacity="0.8"/>
    <stop offset="70%" stop-color="#FF9100" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="airSphere" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="45%" stop-color="#E0F7FA" stop-opacity="0.75"/>
    <stop offset="80%" stop-color="#80DEEA" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="waterSphere" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#2979FF" stop-opacity="0.5"/>
    <stop offset="85%" stop-color="#1A237E" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="earthSphere" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#D7CCC8" stop-opacity="0.85"/>
    <stop offset="40%" stop-color="#8D6E63" stop-opacity="0.6"/>
    <stop offset="80%" stop-color="#3E2723" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
  </radialGradient>

  <!-- Reusable Base Figure (Dark Silhouette with exact face details) -->
  <g id="meditating-figure">
    <ellipse cx="300" cy="720" rx="115" ry="13" fill="#888780" opacity="0.15"/>
    <path d="M215 700 Q205 660 220 630 Q235 615 260 615 L260 640 Q245 655 245 680 Q245 700 260 705 Z" fill="#5F5E5A" opacity="0.4" stroke="#444441" stroke-width="1"/>
    <path d="M385 700 Q395 660 380 630 Q365 615 340 615 L340 640 Q355 655 355 680 Q355 700 340 705 Z" fill="#5F5E5A" opacity="0.4" stroke="#444441" stroke-width="1"/>
    <path d="M225 615 Q210 560 225 520 Q235 495 260 480 L260 500 Q245 515 240 540 Q235 570 245 605 Q250 615 260 618 Z" fill="#5F5E5A" opacity="0.38" stroke="#444441" stroke-width="1"/>
    <path d="M375 615 Q390 560 375 520 Q365 495 340 480 L340 500 Q355 515 360 540 Q365 570 355 605 Q350 615 340 618 Z" fill="#5F5E5A" opacity="0.38" stroke="#444441" stroke-width="1"/>
    <path d="M245 630 Q225 590 235 550 L250 500 Q235 480 238 460 Q255 452 300 450 Q345 452 362 460 Q365 480 350 500 L365 550 Q375 590 355 630 Q300 650 245 630 Z" fill="#6B6A65" opacity="0.4" stroke="#444441" stroke-width="1"/>
    <path d="M258 460 Q248 400 262 355 Q275 330 300 322 Q325 330 338 355 Q352 400 342 460 Q321 470 300 471 Q279 470 258 460 Z" fill="#888780" opacity="0.32" stroke="#5F5E5A" stroke-width="1"/>
    <circle cx="300" cy="278" r="42" fill="#B4B2A9" opacity="0.4" stroke="#5F5E5A" stroke-width="1"/>
    <path d="M262 265 Q262 224 300 218 Q338 224 338 265 Q338 238 300 232 Q262 238 262 265 Z" fill="#2C2C2A" opacity="0.55"/>
    <ellipse cx="286" cy="280" rx="3" ry="4" fill="#2C2C2A" opacity="0.4"/>
    <ellipse cx="314" cy="280" rx="3" ry="4" fill="#2C2C2A" opacity="0.4"/>
    <path d="M292 300 Q300 305 308 300" stroke="#5F5E5A" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M270 246 Q286 240 298 244" stroke="#2C2C2A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M330 246 Q314 240 302 244" stroke="#2C2C2A" stroke-width="1.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>
</defs>

<!-- BACKGROUND -->
<rect width="720" height="940" fill="#0d0d0d"/>


<!-- ================= THE MEDITATING FIGURE ================= -->
<use href="#meditating-figure" />


<!-- ================================================================= -->
<!-- ======================= STATIC CHAKRAS ========================== -->
<!-- ================================================================= -->
<!-- Kept subtle to emphasize the external focus sphere -->
<g transform="translate(300,605)" opacity="0.25">
  <polygon points="0,-22 19,11 -19,11" fill="#E24B4A" stroke="#791F1F" stroke-width="1"><animateTransform attributeName="transform" type="scale" values="1,1;0.1,1;-1,1;0.1,1;1,1" dur="0.55s" repeatCount="indefinite"/></polygon>
</g>
<g transform="translate(300,375)" opacity="0.25">
  <polygon points="0,-20 18,0 0,20 -18,0" fill="#5DCAA5" stroke="#085041" stroke-width="1"><animateTransform attributeName="transform" type="scale" values="1,1;0.1,1;-1,1;0.1,1;1,1" dur="0.55s" repeatCount="indefinite"/></polygon>
</g>


<!-- ================================================================= -->
<!-- ================ THE EXTERNAL EVOCATION SPHERES ================= -->
<!-- ================================================================= -->
<!-- Located at X=300, Y=410, floating in front of the body's chest -->

<!-- STAGE 1: FIRE SPHERE (0s - 6s) -->
<g filter="url(#heavyGlow)" opacity="0">
  <animate attributeName="opacity" values="0.85; 0.85; 0; 0; 0" keyTimes="0; 0.22; 0.25; 0.98; 1" dur="24s" repeatCount="indefinite"/>
  <circle cx="300" cy="410" r="50" fill="url(#fireSphere)">
    <animate attributeName="r" values="45; 55; 45" dur="1s" repeatCount="indefinite"/>
  </circle>
  <!-- Incoming Fire Particles -->
  <g stroke="#FF9100" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 120 410 L 250 410" stroke-dasharray="15 60"><animate attributeName="stroke-dashoffset" values="0; -75" dur="1s" repeatCount="indefinite"/></path>
    <path d="M 480 410 L 350 410" stroke-dasharray="15 60"><animate attributeName="stroke-dashoffset" values="0; 75" dur="1s" repeatCount="indefinite"/></path>
    <path d="M 300 230 L 300 360" stroke-dasharray="15 60"><animate attributeName="stroke-dashoffset" values="0; -75" dur="1s" repeatCount="indefinite"/></path>
  </g>
</g>

<!-- STAGE 2: AIR SPHERE (6s - 12s) -->
<g filter="url(#glow)" opacity="0">
  <animate attributeName="opacity" values="0; 0; 0.85; 0.85; 0; 0" keyTimes="0; 0.23; 0.25; 0.47; 0.49; 1" dur="24s" repeatCount="indefinite"/>
  <circle cx="300" cy="410" r="55" fill="url(#airSphere)">
    <animate attributeName="r" values="50; 60; 50" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Swirling Breezy Rings -->
  <ellipse cx="300" cy="410" rx="65" ry="20" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="8 12">
    <animateTransform attributeName="transform" type="rotate" values="0 300 410; 360 300 410" dur="4s" repeatCount="indefinite"/>
  </ellipse>
</g>

<!-- STAGE 3: WATER SPHERE (12s - 18s) -->
<g filter="url(#heavyGlow)" opacity="0">
  <animate attributeName="opacity" values="0; 0; 0.9; 0.9; 0; 0" keyTimes="0; 0.48; 0.50; 0.72; 0.74; 1" dur="24s" repeatCount="indefinite"/>
  <circle cx="300" cy="410" r="50" fill="url(#waterSphere)" />
  <!-- Shrinking Cold Wave Ripples -->
  <g stroke="#00E5FF" stroke-width="2" fill="none">
    <circle cx="300" cy="410" r="90"><animate attributeName="r" values="90; 10" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.8; 1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="410" r="120"><animate attributeName="r" values="120; 10" begin="1s" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.8; 1" begin="1s" dur="2s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- STAGE 4: EARTH SPHERE (18s - 24s) -->
<g filter="url(#glow)" opacity="0">
  <animate attributeName="opacity" values="0; 0; 0.8; 0.8; 0" keyTimes="0; 0.73; 0.75; 0.97; 1" dur="24s" repeatCount="indefinite"/>
  <circle cx="300" cy="410" r="45" fill="url(#earthSphere)" stroke="#8D6E63" stroke-width="2" />

    <script>
      (function () {
        "use strict";

        var META = JSON.parse(document.getElementById('meditation-meta').textContent);
        var CATS = META.categories;
        var CAT_ORDER = META.cat_order;
        var MEDS = META.meditations;

        var portalGrid = document.getElementById('portal-grid');
        var portalView = document.querySelector('[data-view="portal"]');
        var viewerView = document.querySelector('[data-view="viewer"]');
        var svgFrame = document.getElementById('svg-frame');
        var viewerTitle = document.getElementById('viewer-title');
        var viewerDesc = document.getElementById('viewer-desc');
        var viewerEyebrow = document.getElementById('viewer-eyebrow');
        var backLink = document.getElementById('back-link');
        var exportBtn = document.getElementById('export-btn');
        var toast = document.getElementById('toast');

        var byId = {};
        MEDS.forEach(function (m) { byId[m.id] = m; });

        var byCat = {};
        MEDS.forEach(function (m) {
          if (!byCat[m.category]) byCat[m.category] = [];
          byCat[m.category].push(m);
        });

        // ---------- Build the portal grid ----------
        CAT_ORDER.forEach(function (catKey) {
          var cat = CATS[catKey];
          var section = document.createElement('section');
          section.className = 'stage-column ' + catKey;

          var header = document.createElement('div');
          header.className = 'stage-header';
          header.innerHTML =
            '<div class="stage-title-esoteric">' + cat.esoteric + '</div>' +
            '<h2 class="stage-title">' + cat.title + '</h2>' +
            '<p class="stage-desc">' + cat.desc + '</p>';
          section.appendChild(header);

          var ul = document.createElement('ul');
          ul.className = 'meditations-list';

          (byCat[catKey] || []).forEach(function (m) {
            var li = document.createElement('li');
            li.className = 'meditation-item';

            var link = document.createElement('a');
            link.className = 'meditation-link';
            link.href = '#' + m.id;
            link.innerHTML =
              '<span class="meditation-title">' + m.title + '</span>' +
              '<span class="meditation-desc">' + m.desc + '</span>';

            li.appendChild(link);
            ul.appendChild(li);
          });

          section.appendChild(ul);
          portalGrid.appendChild(section);
        });

        // ---------- Routing ----------
        function showPortal() {
          portalView.classList.add('active');
          viewerView.classList.remove('active');
          svgFrame.innerHTML = '';
          document.title = 'Meditation Portal';
          window.scrollTo(0, 0);
        }

        function showMeditation(id) {
          var m = byId[id];
          if (!m) {
            showPortal();
            return;
          }

          var cat = CATS[m.category];
          viewerEyebrow.textContent = cat.esoteric + ' — ' + cat.title;
          viewerEyebrow.className = 'viewer-eyebrow ' + m.category;
          viewerTitle.textContent = m.title;
          viewerDesc.textContent = m.desc;

          var tpl = document.getElementById('tpl-' + id);
          svgFrame.innerHTML = '';
          if (tpl) {
            // Clone the ORIGINAL, untouched SVG markup from its template into the live DOM.
            var clone = tpl.content.cloneNode(true);
            svgFrame.appendChild(clone);
          }

          portalView.classList.remove('active');
          viewerView.classList.add('active');
          document.title = m.title + ' — Meditation Portal';
          window.scrollTo(0, 0);
        }

        function route() {
          var hash = window.location.hash.replace(/^#/, '');
          if (hash && byId[hash]) {
            showMeditation(hash);
          } else {
            showPortal();
          }
        }

        window.addEventListener('hashchange', route);
        backLink.addEventListener('click', function () {
          window.location.hash = '';
        });

        // ---------- Export SVG ----------
        function currentMeditation() {
          var hash = window.location.hash.replace(/^#/, '');
          return byId[hash];
        }

        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add('show');
          clearTimeout(showToast._t);
          showToast._t = setTimeout(function () {
            toast.classList.remove('show');
          }, 2200);
        }

        exportBtn.addEventListener('click', function () {
          var m = currentMeditation();
          if (!m) return;

          var tpl = document.getElementById('tpl-' + m.id);
          if (!tpl) return;

          // Grab the exact original SVG source text, untouched.
          var svgSource = tpl.innerHTML.trim();

          var blob = new Blob([svgSource], { type: 'image/svg+xml' });
          var url = URL.createObjectURL(blob);

          var a = document.createElement('a');
          a.href = url;
          a.download = m.id + '.svg';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          showToast('SVG exported — ready to drop into any HTML or PHP page.');
        });

        // ---------- Init ----------
        route();
      })();
    </script>

  </body>
</html>
